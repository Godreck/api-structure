services:
  postgres:
    image: postgres:16
    container_name: api-structure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_pass
      POSTGRES_DB: api_structure
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_structure"]
      interval: 5s
      timeout: 3s
      retries: 10

app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-structure-app
    restart: unless-stopped
    environment:
      DB_DSN: host=postgres port=5432 user=api_user password=api_pass dbname=api_structure sslmode=disable TimeZone=UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  pg:
